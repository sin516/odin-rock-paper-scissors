<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getComputerChoice() {
            let choice = Math.floor(Math.random() * 3);
            if (choice === 0) {
                return 'rock'
            }
            else if (choice === 1) {
                return 'paper'
            }
            else if (choice === 2) {
                return 'scissors'
            }
        }
        function getHumanChoice(){
            let humanChoice = prompt('rock paper scissors?').toLowerCase()
            return humanChoice
        }
        function playGame() {
            let humanScore = 0;
            let computerScore = 0;
            function playRound(humanChoice, computerChoice) {
                if (humanChoice === 'rock') {
                    humanNum = 0
                }
                else if (humanChoice === 'paper') {
                    humanNum = 1
                }
                else {
                    humanNum = 2
                }
                if (computerChoice === 'rock') {
                    computerNum = 0
                }
                else if (computerChoice === 'paper') {
                    computerNum = 1
                }
                else {
                    computerNum = 2
                }
                const result = document.createElement("p");
                if (humanNum === computerNum) {
                    result.textContent = "It's a tie!";
                }
                else if ((humanNum - computerNum + 3) % 3 === 1) {
                    result.textContent = `You win! ${humanChoice} beats ${computerChoice}.`;
                    humanScore++
                }
                else {
                    result.textContent = `You lose! ${computerChoice} beats ${humanChoice}.`;
                    computerScore++
                }
                results.appendChild(result);
                if (humanScore == 5) {
                    const winner = document.createElement("p");
                    winner.textContent = `Human Win! ${humanScore} to ${computerScore}`;
                    results.appendChild(winner);
                }
                else if (computerScore == 5) {
                    const winner = document.createElement("p");
                    winner.textContent = `Computer Win! ${computerScore} to ${humanScore}`;
                    results.appendChild(winner);
                }
            }
            const rock = document.createElement("button");
            const paper = document.createElement("button");
            const scissors = document.createElement("button");
            rock.textContent = "rock";
            paper.textContent = "paper";
            scissors.textContent = "scissors";
            document.body.appendChild(rock);
            document.body.appendChild(paper);
            document.body.appendChild(scissors);
            const choices = document.querySelectorAll("button");
            choices.forEach((choice) => {
                choice.addEventListener("click", () => {
                    playRound(choice.textContent, getComputerChoice());
                });
            });

            const results = document.createElement("Div");
            document.body.append(results)
            
        }
        
        playGame()

        

    </script>
</body>
</html>
