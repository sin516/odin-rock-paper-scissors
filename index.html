<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getComputerChoice() {
            let choice = Math.floor(Math.random() * 3);
            if (choice === 0) {
                return 'rock'
            }
            else if (choice === 1) {
                return 'paper'
            }
            else if (choice === 2) {
                return 'scissors'
            }
        }
        function getHumanChoice(){
            let humanChoice = prompt('rock paper scissors?').toLowerCase()
            return humanChoice
        }
        function playGame() {
            let humanScore = 0;
            let computerScore = 0;
            function playRound(humanChoice, computerChoice) {
                if (humanChoice === 'rock') {
                    humanNum = 0
                }
                else if (humanChoice === 'paper') {
                    humanNum = 1
                }
                else {
                    humanNum = 2
                }
                if (computerChoice === 'rock') {
                    computerNum = 0
                }
                else if (computerChoice === 'paper') {
                    computerNum = 1
                }
                else {
                    computerNum = 2
                }
                if (humanNum === computerNum) {
                    console.log("It's a tie!")
                }
                else if ((humanNum - computerNum + 3) % 3 === 1) {
                    console.log(`You win! ${humanChoice} beats ${computerChoice}.`)
                    humanScore++
                }
                else {
                    console.log(`You lose! ${computerChoice} beats ${humanChoice}.`)
                    computerScore++
                }
            }
            playRound(getHumanChoice(), getComputerChoice())
            playRound(getHumanChoice(), getComputerChoice())
            playRound(getHumanChoice(), getComputerChoice())
            playRound(getHumanChoice(), getComputerChoice())
            playRound(getHumanChoice(), getComputerChoice())
            if (humanScore > computerScore) {
                console.log(`Human Win! ${humanScore} to ${computerScore}`)
            }
            else {
                console.log(`Computer Win! ${computerScore} to ${humanScore}`)
            }
        }
        
        playGame()

        

    </script>
</body>
</html>
